# Disable Spring Cloud compatibility verification for tests to avoid BOM mismatches
spring.cloud.compatibility-verifier.enabled=false

# Expose the refresh endpoint for actuator during tests
management.endpoints.web.exposure.include=health,info,refresh

# Disable Spring Security auto-configuration for easier testing of endpoints in integration tests
#spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.SecurityAutoConfiguration,org.springframework.boot.actuate.autoconfigure.security.servlet.ManagementWebSecurityAutoConfiguration

# Defer datasource initialization so JPA/Hibernate creates schema before data.sql is applied
spring.jpa.defer-datasource-initialization=true
