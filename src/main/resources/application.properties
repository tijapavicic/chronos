spring.application.name=chronos
server.port=8080

# H2 Database Configuration
spring.datasource.url=jdbc:h2:mem:simulation
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.defer-datasource-initialization=true

# H2 Console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Actuator - expose only health and info endpoints over HTTP
#management.endpoints.web.exposure.include=*
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# Disable Spring Cloud compatibility checks to run with this Spring Boot version during local development
spring.cloud.compatibility-verifier.enabled=false

# ??? Kafka Producer ???????????????????????????????????????????????????????????
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.ByteArraySerializer
# Retry on transient errors; idempotent producer prevents duplicates
spring.kafka.producer.retries=3
spring.kafka.producer.properties.enable.idempotence=true
# Give up quickly if Kafka is unavailable so the HTTP thread is not blocked
spring.kafka.producer.properties.max.block.ms=3000
# Admin client: do NOT fail app startup when Kafka is temporarily unreachable
spring.kafka.admin.fail-fast=false

# ??? Application-specific Kafka topic names ???????????????????????????????????
chronos.kafka.topic.traffic-log=simulation.traffic.log

